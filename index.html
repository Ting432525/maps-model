<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>โมเดลเมือง 3D</title>
<meta name="theme-color" content="#1f5fa8">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f7f6f2;--fg:#1d2733;--mut:#6b7684;--line:#d5d8dc;--acc:#1f5fa8}
@media(prefers-color-scheme:dark){:root{--bg:#14191f;--fg:#e6e9ed;--mut:#8c97a4;--line:#2b333c;--acc:#5aa2e8}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
#stage{flex:1;position:relative;min-height:0}
#map,#view{position:absolute;inset:0}
#view{display:none}
#view canvas{width:100%;height:100%;display:block;touch-action:none}
.panel{padding:10px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;padding:9px 14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=range]{flex:1;min-width:120px}
#st{color:var(--mut);font-size:14px;min-height:1.3em}
/* --- จอมือถือ: แผนที่เต็มจอ เมนูเป็นลิ้นชักซ้าย --- */
header{display:none}
#stage{position:fixed;inset:0;flex:none}
.panel{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);overflow-y:auto;z-index:2000;
  align-content:start;border-top:0;border-right:1px solid var(--line);background:var(--bg);
  padding:12px 14px calc(16px + env(safe-area-inset-bottom));
  transform:translateX(-105%);transition:transform .22s ease;box-shadow:2px 0 14px rgba(0,0,0,.25)}
.panel.open{transform:none}
.fl{position:fixed;z-index:1500;border-radius:22px;padding:10px 16px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#menu{left:10px;top:10px}
#fab{right:10px;bottom:48px;background:var(--acc);color:#fff;border-color:var(--acc)}
#st{position:fixed;left:10px;right:10px;bottom:100px;z-index:1500;background:var(--bg);color:var(--fg);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#st:empty{display:none}
#top{position:fixed;left:10px;right:58px;top:10px;z-index:1500;display:flex;gap:6px}
#top button{border-radius:22px;padding:10px 12px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#top input{flex:1;min-width:0;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:22px;
  background:var(--bg);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.3)}
</style>
</head>
<body>
<header>โมเดลเมือง 3D จากข้อมูล OpenStreetMap</header>
<div id="stage"><div id="map"></div><div id="view"></div></div>
<div class="panel" id="panel">
  <div class="row" style="justify-content:space-between"><b>เมนูคำสั่ง</b><button id="close">✕ ปิด</button></div>
  <div class="row">
    <label><input id="ct" type="checkbox" checked> ภูมิประเทศ 3D</label>
    <label><input id="cl" type="checkbox" checked> เส้นชั้นความสูง</label>
    <label for="iv">ทุก</label>
    <select id="iv" style="font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)">
      <option value="0">อัตโนมัติ</option><option value="1">1 ม.</option><option value="2">2 ม.</option>
      <option value="5">5 ม.</option><option value="10">10 ม.</option><option value="20">20 ม.</option>
    </select>
  </div>
  <div class="row">
    <label><input id="mg" type="checkbox" checked> ลายเส้นมังงะ</label>
    <label for="lw">หนา</label>
    <input id="lw" type="range" min="1" max="6" step="0.5" value="2.5">
  </div>
  <div class="row">
    <label for="rk">เส้นถนน อ่อน–เข้ม</label>
    <input id="rk" type="range" min="0" max="1" step="0.05" value="1">
  </div>
  <div class="row">
    <label for="size">ขนาดพื้นที่</label>
    <input id="size" type="range" min="0.2" max="5" step="0.1" value="0.6">
    <b id="sz"></b>
  </div>
  <div class="row">
    <button id="loc">ตำแหน่งของฉัน</button>
    <button id="inst" hidden>ติดตั้งแอป</button>
    <button id="go" class="p">สร้างโมเดล</button>
    <button id="back" disabled>กลับไปแผนที่</button>
  </div>
  <div class="row">
    <button id="dxf" disabled>ดาวน์โหลด DXF</button>
    <button id="stl" disabled>ดาวน์โหลด STL</button>
    <button id="dae" disabled>ดาวน์โหลด DAE (SketchUp)</button>
    <button id="obj" disabled>ดาวน์โหลด OBJ</button>
    <button id="svg" disabled>ดาวน์โหลด SVG (Illustrator)</button>
    <button id="ifc" disabled>ดาวน์โหลด IFC</button>
  </div>
</div>
<div id="st">เลื่อนแผนที่ให้กรอบอยู่ตรงพื้นที่ที่ต้องการ แล้วกด "สร้างโมเดล"</div>
<div id="top"><button id="menu">☰ เมนู</button><input id="q" type="search" placeholder="ค้นหาสถานที่"><button id="sr" aria-label="ค้นหา">🔍</button></div>
<button id="fab" class="fl">สร้างโมเดล</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);

/* ---------- 1. แผนที่ + กรอบพื้นที่ ---------- */
const map = L.map('map', {zoomControl: false}).setView([13.7563, 100.5018], 16);
L.control.zoom({position: 'topright'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap contributors'
}).addTo(map);
const rect = L.rectangle([[0,0],[0,0]], {color:'#1f5fa8', weight:2, fillOpacity:.1}).addTo(map);

function bounds() {
  const c = map.getCenter(), k = +$('size').value;
  const dLat = k*1000/2/110540;
  const dLon = k*1000/2/(111320*Math.cos(c.lat*Math.PI/180));
  return {c, s:c.lat-dLat, n:c.lat+dLat, w:c.lng-dLon, e:c.lng+dLon};
}
function drawRect() {
  const b = bounds();
  rect.setBounds([[b.s,b.w],[b.n,b.e]]);
  $('sz').textContent = (+$('size').value).toFixed(1) + ' กม.';
}
map.on('move', drawRect);
$('size').oninput = drawRect;
drawRect();
$('loc').onclick = () => { closeMenu(); map.locate({setView:true, maxZoom:16}); };
map.on('locationerror', () => $('st').textContent = 'เข้าถึงตำแหน่งไม่ได้ ตรวจสอบสิทธิ์ตำแหน่งของเบราว์เซอร์');

/* ---------- 2. ดึงข้อมูลจาก Overpass ---------- */
let M = null; // {tris:[x,y,z,...], roads:[[[x,y],...]], nb}

async function build() {
  const b = bounds();
  closeMenu(); $('go').disabled = $('fab').disabled = true;
  $('st').textContent = 'กำลังดึงข้อมูลอาคารและถนน...';
  const bb = `${b.s},${b.w},${b.n},${b.e}`;
  const q = `[out:json][timeout:90];(way["building"](${bb});way["highway"](${bb});way["waterway"~"^(river|canal|stream|riverbank)$"](${bb});relation["natural"="water"](${bb});way["natural"~"^(water|wood)$"](${bb});way["leisure"="park"](${bb});way["landuse"~"^(grass|forest|meadow)$"](${bb}););out geom;`;
  try {
    let j = null, last = '';
    for (const ep of ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter']) {
      try {
        const r = await fetch(ep, {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: 'data=' + encodeURIComponent(q)
        });
        if (!r.ok) throw new Error('เซิร์ฟเวอร์ตอบ ' + r.status);
        j = await r.json(); break;
      } catch (e) { last = e.message; }
    }
    if (!j) throw new Error(last);
    const raw = convert(j.elements, b);
    if (!raw.B.length && !raw.R.length) throw new Error('ไม่พบข้อมูลในพื้นที่นี้');
    let note = '', tr = null;
    if ($('ct').checked || $('cl').checked) {
      $('st').textContent = 'กำลังดึงข้อมูลความสูง...';
      try {
        tr = await terrain(b, +$('size').value);
        note = ` · ความสูงพื้นที่ ${tr.min.toFixed(0)}–${tr.max.toFixed(0)} ม. จากระดับน้ำทะเล`
          + (tr.contours.length ? ` · เส้นชั้นความสูง ${tr.contours.length} เส้น` : '');
      } catch (err) { note = ' · ดึงข้อมูลความสูงไม่ได้ (' + err.message + ')'; }
    }
    M = assemble(raw, tr);
    M.lat = b.c.lat; M.lng = b.c.lng;
    show();
    $('st').textContent = `อาคาร ${M.nb} หลัง · ถนน ${M.roads.length} เส้น` + note + (M.nb > 15000 ? ' · ตึกมากกว่า 15,000 หลัง จึงไม่วาดลายเส้นมังงะรอบตึก' : '') + ' · หน่วยเป็นเมตร จุดกำเนิดอยู่กลางพื้นที่';
    $('dxf').disabled = $('stl').disabled = $('dae').disabled = $('obj').disabled = $('svg').disabled = $('ifc').disabled = $('back').disabled = false;
  } catch (e) {
    $('st').textContent = 'ผิดพลาด: ' + e.message + ' (ลองลดขนาดพื้นที่แล้วกดใหม่)';
  }
  $('go').disabled = $('fab').disabled = false;
}
$('go').onclick = build;

/* ---------- 2.1 ค้นหาสถานที่ (Nominatim) ---------- */
async function search() {
  const q = $('q').value.trim(); if (!q) return;
  viewMode(false);
  closeMenu(); $('st').textContent = 'กำลังค้นหา...';
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    const j = await r.json();
    if (!j.length) throw new Error('ไม่พบสถานที่ "' + q + '"');
    map.setView([+j[0].lat, +j[0].lon], 16);
    $('st').textContent = j[0].display_name;
  } catch (e) { $('st').textContent = 'ค้นหาไม่ได้: ' + e.message; }
}
$('sr').onclick = search;
$('q').onkeydown = e => { if (e.key === 'Enter') search(); };

/* ---------- 2.2 ภูมิประเทศ + เส้นชั้นความสูง ---------- */
function loadTile(z, x, y) {                  // AWS Terrain Tiles (terrarium): สูง = R*256 + G + B/256 - 32768
  return new Promise((res, rej) => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d', {willReadFrequently: true});
      g.drawImage(im, 0, 0);
      const d = g.getImageData(0, 0, 256, 256).data, e = new Float32Array(65536);
      for (let i = 0; i < 65536; i++) e[i] = d[i*4]*256 + d[i*4+1] + d[i*4+2]/256 - 32768;
      res(e);
    };
    im.onerror = () => rej(new Error('โหลดภาพความสูงไม่ได้'));
    im.src = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`;
  });
}

async function terrain(b, size) {
  const z = 14, N = Math.pow(2, z)*256;
  const px = lon => (lon+180)/360*N;
  const py = lat => { const r = lat*Math.PI/180; return (1 - Math.log(Math.tan(r) + 1/Math.cos(r))/Math.PI)/2*N; };
  const x0 = px(b.w)-2, x1 = px(b.e)+2, y0 = py(b.n)-2, y1 = py(b.s)+2;
  const tiles = new Map(), jobs = [];
  for (let ty = Math.floor(y0/256); ty <= Math.floor(y1/256); ty++)
    for (let tx = Math.floor(x0/256); tx <= Math.floor(x1/256); tx++)
      jobs.push(loadTile(z, tx, ty).then(e => tiles.set(tx+','+ty, e)));
  await Promise.all(jobs);
  const get = (ix, iy) => {
    const t = tiles.get(Math.floor(ix/256)+','+Math.floor(iy/256));
    return t ? t[(((iy%256)+256)%256)*256 + (((ix%256)+256)%256)] : NaN;
  };
  const el = (lon, lat) => {                  // ค่าเฉลี่ยแบบ bilinear
    const fx = px(lon)-.5, fy = py(lat)-.5, ix = Math.floor(fx), iy = Math.floor(fy), u = fx-ix, v = fy-iy;
    return (get(ix,iy)*(1-u) + get(ix+1,iy)*u)*(1-v) + (get(ix,iy+1)*(1-u) + get(ix+1,iy+1)*u)*v;
  };
  const n1 = Math.min(200, Math.max(20, Math.round(size*100)));   // ช่องละประมาณ 10 ม.
  const half = size*500, d = size*1000/n1, W = n1+1, Z = new Float32Array(W*W);
  let mn = 1e9, mx = -1e9;
  for (let j = 0; j <= n1; j++) for (let i = 0; i <= n1; i++) {
    const v = el(b.w + (b.e-b.w)*i/n1, b.s + (b.n-b.s)*j/n1);
    if (!isFinite(v)) throw new Error('ข้อมูลความสูงไม่ครบ');
    Z[j*W+i] = v; if (v < mn) mn = v; if (v > mx) mx = v;
  }
  const rg = mx-mn;
  const iv = $('iv').value === '0' ? ([1,2,5,10,20,50,100].find(v => rg/v <= 15) || 200) : +$('iv').value;
  const contours = [];
  if ($('cl').checked && rg >= iv)
    for (let L = Math.ceil(mn/iv)*iv; L <= mx; L += iv)
      for (const pts of marching(Z, n1, n1, -half, -half, d, d, L)) contours.push({z: L-mn, pts});
  const h = (x, y) => {                       // ความสูงสัมพัทธ์ที่จุด (x,y) เป็นเมตร
    const fx = Math.min(n1-1e-6, Math.max(0, (x+half)/d)), fy = Math.min(n1-1e-6, Math.max(0, (y+half)/d));
    const i = Math.floor(fx), j = Math.floor(fy), u = fx-i, v = fy-j;
    return (Z[j*W+i]*(1-u) + Z[j*W+i+1]*u)*(1-v) + (Z[(j+1)*W+i]*(1-u) + Z[(j+1)*W+i+1]*u)*v - mn;
  };
  return {contours, min: mn, max: mx, n1, half, d, Z, mn, h};
}

function marching(Z, nx, ny, x0, y0, dx, dy, L) {   // marching squares แล้วต่อเส้นเป็นสายยาว
  const W = nx+1, pts = new Map(), segs = [], adj = new Map();
  const T = [[],[[3,0]],[[0,1]],[[3,1]],[[1,2]],[[0,1],[2,3]],[[0,2]],[[3,2]],[[2,3]],[[0,2]],[[3,0],[1,2]],[[1,2]],[[3,1]],[[0,1]],[[3,0]],[]];
  const edge = (e, i, j) => {
    let k, a, b;
    if (e === 0)      { k = 'h'+i+','+j;       a = [i,j];     b = [i+1,j]; }
    else if (e === 2) { k = 'h'+i+','+(j+1);   a = [i,j+1];   b = [i+1,j+1]; }
    else if (e === 1) { k = 'v'+(i+1)+','+j;   a = [i+1,j];   b = [i+1,j+1]; }
    else              { k = 'v'+i+','+j;       a = [i,j];     b = [i,j+1]; }
    if (!pts.has(k)) {
      const za = Z[a[1]*W+a[0]], zb = Z[b[1]*W+b[0]], t = (L-za)/(zb-za);
      pts.set(k, [x0 + (a[0] + (b[0]-a[0])*t)*dx, y0 + (a[1] + (b[1]-a[1])*t)*dy]);
    }
    return k;
  };
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const c = (Z[j*W+i] >= L ? 1 : 0) | (Z[j*W+i+1] >= L ? 2 : 0) | (Z[(j+1)*W+i+1] >= L ? 4 : 0) | (Z[(j+1)*W+i] >= L ? 8 : 0);
    for (const [e1, e2] of T[c]) {
      const k1 = edge(e1,i,j), k2 = edge(e2,i,j), s = segs.length;
      segs.push([k1,k2]);
      for (const k of [k1,k2]) { if (!adj.has(k)) adj.set(k, []); adj.get(k).push(s); }
    }
  }
  const used = new Uint8Array(segs.length), lines = [];
  const next = k => { for (const s of adj.get(k)) if (!used[s]) return s; return -1; };
  for (let s0 = 0; s0 < segs.length; s0++) {
    if (used[s0]) continue;
    used[s0] = 1;
    const ks = [segs[s0][0], segs[s0][1]];
    for (let side = 0; side < 2; side++) for (;;) {
      const end = side ? ks[0] : ks[ks.length-1], s = next(end);
      if (s < 0) break;
      used[s] = 1;
      const o = segs[s][0] === end ? segs[s][1] : segs[s][0];
      if (side) ks.unshift(o); else ks.push(o);
    }
    lines.push(ks.map(k => pts.get(k)));
  }
  return lines;
}

/* ---------- 2.9 ชนิดถนนและสี (โทนเดียวกับ Google Maps) ---------- */
const RCLS = [
  {layer:'ROADS_EXPRESSWAY', c:0xf4a43a, css:'#f4a43a'},   // ทางด่วน
  {layer:'ROADS_MAIN',       c:0xfcd34d, css:'#fcd34d'},   // ทางหลัก
  {layer:'ROADS_SECONDARY',  c:0xfff0b3, css:'#fff0b3'},   // ถนนรอง
  {layer:'ROADS_LOCAL',      c:0xffffff, css:'#ffffff'},   // ซอย
  {layer:'ROADS_PATH',       c:0xd5d5d5, css:'#d5d5d5'},   // ทางเดิน/ทางเล็ก
  {layer:'RIVERS',           c:0x5aa6e0, css:'#a8d4f2'}    // แม่น้ำ/คลอง
];
const hwClass = h => /^motorway/.test(h) ? 0 : /^(trunk|primary)/.test(h) ? 1 : /^(secondary|tertiary)/.test(h) ? 2
  : /^(residential|unclassified|service|living_street|road)$/.test(h) ? 3 : 4;

function stitch(parts) {                      // ต่อเส้นขอบแม่น้ำ/ทะเลสาบที่แยกเป็นหลายท่อนให้เป็นวงปิด
  const same = (p, q) => p[0] === q[0] && p[1] === q[1];
  const segs = parts.filter(m => m.length > 1).map(m => m.slice()), out = [];
  while (segs.length) {
    let ring = segs.pop(), moved = true;
    while (moved && !same(ring[0], ring[ring.length-1])) {
      moved = false;
      for (let i = 0; i < segs.length; i++) {
        const t = segs[i], a = ring[0], z = ring[ring.length-1];
        if (same(z, t[0])) ring = ring.concat(t.slice(1));
        else if (same(z, t[t.length-1])) ring = ring.concat(t.slice().reverse().slice(1));
        else if (same(a, t[t.length-1])) ring = t.slice(0, -1).concat(ring);
        else if (same(a, t[0])) ring = t.slice().reverse().slice(0, -1).concat(ring);
        else continue;
        segs.splice(i, 1); moved = true; break;
      }
    }
    if (same(ring[0], ring[ring.length-1])) ring.pop();
    if (ring.length > 2) out.push(ring);
  }
  return out;
}

/* ---------- 3. แปลงพิกัด + ดันอาคารขึ้นเป็น 3 มิติ ---------- */
function convert(els, b) {
  const kx = 111320*Math.cos(b.c.lat*Math.PI/180), ky = 110540;
  const P = g => g.map(p => [(p.lon-b.c.lng)*kx, (p.lat-b.c.lat)*ky]);
  const B = [], R = [], W = [], G = [];
  const poly = g => {
    const p = P(g), f = p[0], l = p[p.length-1];
    if (p.length > 1 && f[0] === l[0] && f[1] === l[1]) p.pop();
    return p;
  };
  const RW = {motorway:14, trunk:14, primary:11, secondary:9, tertiary:7, residential:6, unclassified:6, service:4};
  for (const el of els) {
    if (el.type === 'relation') {              // แม่น้ำ/ทะเลสาบที่เป็น multipolygon
      const ws = (el.members || []).filter(m => m.type === 'way' && m.geometry && m.geometry.length > 1);
      const outer = stitch(ws.filter(m => m.role !== 'inner').map(m => P(m.geometry)));
      const inner = stitch(ws.filter(m => m.role === 'inner').map(m => P(m.geometry)));
      for (const p of outer) W.push({p, h: inner});
      continue;
    }
    if (!el.geometry) continue;
    const t = el.tags || {};
    if (t.building) {
      const p = poly(el.geometry); if (p.length < 3) continue;
      let h = parseFloat(t.height);
      if (!(h > 0)) { const lv = parseFloat(t['building:levels']); h = lv > 0 ? lv*3 : 8; }
      B.push({p, h});
    } else if (t.highway) {
      const k = hwClass(t.highway);
      R.push({p: P(el.geometry), w: RW[t.highway] || [14,11,8,5,3][k], k});
    } else if (/^(river|canal|stream)$/.test(t.waterway || '')) {
      R.push({p: P(el.geometry), w: {river:30, canal:12, stream:5}[t.waterway], k: 5});
    } else if (t.natural === 'water' || t.waterway === 'riverbank') { const p = poly(el.geometry); if (p.length > 2) W.push({p, h: []}); }
    else { const p = poly(el.geometry); if (p.length > 2) G.push({p, h: []}); }
  }
  return {B, R, W, G};
}

function addBuilding(p, h, T, hf) {
  let a = 0;
  for (let i = 0; i < p.length; i++) { const q = p[(i+1)%p.length]; a += p[i][0]*q[1] - q[0]*p[i][1]; }
  if (a < 0) p = p.slice().reverse();          // ให้วนทวนเข็มเสมอ
  const n = p.length, zs = p.map(v => hf(v[0], v[1])), top = Math.max(...zs) + h;
  for (let i = 0; i < n; i++) {                // ผนัง
    const A = p[i], B = p[(i+1)%n];
    T.push(A[0],A[1],zs[i], B[0],B[1],zs[(i+1)%n], B[0],B[1],top,  A[0],A[1],zs[i], B[0],B[1],top, A[0],A[1],top);
  }
  let tr = [];                                 // หลังคา
  try { tr = THREE.ShapeUtils.triangulateShape(p.map(x => new THREE.Vector2(x[0],x[1])), []); } catch (e) {}
  for (const t of tr) {
    let [i,j,k] = t;
    const cz = (p[j][0]-p[i][0])*(p[k][1]-p[i][1]) - (p[j][1]-p[i][1])*(p[k][0]-p[i][0]);
    if (cz < 0) [j,k] = [k,j];                 // หันหน้าขึ้นฟ้า
    T.push(p[i][0],p[i][1],top, p[j][0],p[j][1],top, p[k][0],p[k][1],top);
  }
}

/* ---------- 3.1 ประกอบโมเดล: อาคาร/ถนนวางบนพื้นดิน + พื้นผิวภูมิประเทศ ---------- */
function assemble(raw, tr) {
  const on = tr && $('ct').checked;
  const hf = on ? tr.h : () => 0;
  const tris = [], rcls = RCLS.map(() => []), roads = [], redges = [];
  const bidx = [];
  for (const o of raw.B) { const s = tris.length; addBuilding(o.p, o.h, tris, hf); bidx.push([s, tris.length]); }
  for (const o of raw.R) addRoad(o.p, o.w, hf, rcls[o.k], o.k === 5 ? [] : roads, o.k === 5 ? [] : redges);
  return {raw, bidx, tris, rcls, roads, redges, nb: raw.B.length, contours: tr ? tr.contours : [], terr: on ? terrMesh(tr, raw) : []};
}

function addRoad(p, w, hf, R, C, EG) {            // ถนนเป็นแถบกว้างตามประเภท วางทับพื้นดินสูงขึ้น 0.3 ม.
  const q = [p[0]];
  for (let i = 1; i < p.length; i++) {
    const a = p[i-1], b = p[i], n = Math.max(1, Math.ceil(Math.hypot(b[0]-a[0], b[1]-a[1])/10));
    for (let k = 1; k <= n; k++) q.push([a[0]+(b[0]-a[0])*k/n, a[1]+(b[1]-a[1])*k/n]);
  }
  const z = q.map(v => hf(v[0], v[1]) + .3);
  C.push(q.map((v, i) => [v[0], v[1], z[i]]));
  for (let i = 0; i < q.length-1; i++) {
    const dx = q[i+1][0]-q[i][0], dy = q[i+1][1]-q[i][1], l = Math.hypot(dx, dy) || 1;
    const nx = -dy/l*w/2, ny = dx/l*w/2;
    const A = [q[i][0]+nx, q[i][1]+ny, z[i]], B = [q[i][0]-nx, q[i][1]-ny, z[i]];
    const D = [q[i+1][0]-nx, q[i+1][1]-ny, z[i+1]], E = [q[i+1][0]+nx, q[i+1][1]+ny, z[i+1]];
    R.push(...A, ...B, ...D, ...A, ...D, ...E);
    EG.push(...A, ...E, ...B, ...D);
  }
}

function terrMesh(tr, raw) {                  // ตารางละ 2 สามเหลี่ยม แยกชนิด 0=ดิน 1=น้ำ 2=พื้นที่สีเขียว
  const {n1, half, d, Z, mn} = tr, W = n1+1, out = [];
  const polys = [...raw.W.map(o => [o,1]), ...raw.G.map(o => [o,2])].map(([o, c]) => {
    const p = o.p, xs = p.map(v => v[0]), ys = p.map(v => v[1]);
    return {p, h: o.h, c, x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys)};
  });
  const inside = (x, y, P) => {
    let r = false;
    for (let i = 0, j = P.length-1; i < P.length; j = i++)
      if ((P[i][1] > y) !== (P[j][1] > y) && x < (P[j][0]-P[i][0])*(y-P[i][1])/(P[j][1]-P[i][1]) + P[i][0]) r = !r;
    return r;
  };
  const zz = (a, b) => Z[b*W+a] - mn;
  for (let j = 0; j < n1; j++) for (let i = 0; i < n1; i++) {
    const cx = -half + (i+.5)*d, cy = -half + (j+.5)*d;
    let c = 0;
    for (const o of polys)
      if (cx >= o.x0 && cx <= o.x1 && cy >= o.y0 && cy <= o.y1 && inside(cx, cy, o.p) && !o.h.some(hh => inside(cx, cy, hh))) { if (o.c === 1) { c = 1; break; } c = 2; }
    const x0 = -half + i*d, y0 = -half + j*d, x1 = x0 + d, y1 = y0 + d;
    out.push({c, t: [x0,y0,zz(i,j), x1,y0,zz(i+1,j), x1,y1,zz(i+1,j+1), x0,y0,zz(i,j), x1,y1,zz(i+1,j+1), x0,y1,zz(i,j+1)]});
  }
  return out;
}

/* ---------- 4. แสดงตัวอย่าง 3 มิติ (Three.js) ---------- */
let ren, scene, cam, grp, lineMat, roadMat, edgeGrp;
const rot = {a:.8, e:.7, d:600};
const dark = matchMedia('(prefers-color-scheme: dark)').matches;

function initThree() {
  ren = new THREE.WebGLRenderer({antialias:true});
  ren.setPixelRatio(devicePixelRatio);
  $('view').appendChild(ren.domElement);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(dark ? 0x14191f : 0xf7f6f2);
  cam = new THREE.PerspectiveCamera(50, 1, 1, 100000);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, .85));
  const d = new THREE.DirectionalLight(0xffffff, .6); d.position.set(1,2,.5); scene.add(d);
  grp = new THREE.Group(); scene.add(grp);
  lineMat = new THREE.ShaderMaterial({         // เส้นหนาในหน่วยพิกเซล ขยายเป็นแถบบนหน้าจอ
    uniforms: {res: {value: new THREE.Vector2(1,1)}, width: {value: 3}, color: {value: new THREE.Color(dark ? 0xf2f2f2 : 0x111111)}, bg: {value: new THREE.Color(dark ? 0x14191f : 0xf7f6f2)}, k: {value: 1}},
    vertexShader: `
      attribute vec3 pb; attribute vec2 corner;
      uniform vec2 res; uniform float width;
      void main() {
        mat4 m = projectionMatrix * modelViewMatrix;
        vec4 ca = m * vec4(position, 1.0), cb = m * vec4(pb, 1.0);
        vec2 sa = ca.xy/ca.w*res*.5, sb = cb.xy/cb.w*res*.5;
        vec2 d = sb - sa; float l = length(d);
        d = l > 1e-4 ? d/l : vec2(1.0, 0.0);
        vec2 n = vec2(-d.y, d.x);
        vec4 c = corner.x < .5 ? ca : cb;
        vec2 off = (n*corner.y + d*(corner.x < .5 ? -1.0 : 1.0)) * width * .5;
        gl_Position = vec4(c.xy + off*2.0/res*c.w, c.z - 3e-4*c.w, c.w);
      }`,
    fragmentShader: 'uniform vec3 color; uniform vec3 bg; uniform float k; void main() { gl_FragColor = vec4(mix(bg, color, k), 1.0); }',
    side: THREE.DoubleSide
  });

  roadMat = lineMat.clone();                   // วัสดุเส้นถนนแยก ปรับความเข้มได้อิสระ
  roadMat.uniforms.res = lineMat.uniforms.res;
  roadMat.uniforms.width = lineMat.uniforms.width;
  const el = ren.domElement, ptr = new Map();
  el.onpointerdown = e => { el.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]); };
  el.onpointerup = el.onpointercancel = e => ptr.delete(e.pointerId);
  el.onpointermove = e => {
    const o = ptr.get(e.pointerId); if (!o) return;
    if (ptr.size === 1) {
      rot.a -= (e.clientX-o[0])*.008;
      rot.e = Math.max(.05, Math.min(1.55, rot.e + (e.clientY-o[1])*.008));
    } else if (ptr.size === 2) {
      const other = [...ptr].find(([id]) => id !== e.pointerId)[1];
      const d0 = Math.hypot(o[0]-other[0], o[1]-other[1]);
      const d1 = Math.hypot(e.clientX-other[0], e.clientY-other[1]);
      if (d1 > 0) rot.d *= d0/d1;
    }
    ptr.set(e.pointerId, [e.clientX, e.clientY]); draw();
  };
  el.onwheel = e => { e.preventDefault(); rot.d *= e.deltaY > 0 ? 1.1 : .9; draw(); };
  addEventListener('resize', resize);
}
function resize() {
  if (!ren) return;
  const v = $('view'), w = v.clientWidth, h = v.clientHeight;
  if (!w || !h) return;
  ren.setSize(w, h); cam.aspect = w/h; cam.updateProjectionMatrix(); applyLines();
}
function draw() {
  const {a,e,d} = rot;
  cam.position.set(d*Math.cos(e)*Math.sin(a), d*Math.sin(e), d*Math.cos(e)*Math.cos(a));
  cam.lookAt(0,0,0); ren.render(scene, cam);
}
function viewMode(on) {
  $('view').style.display = on ? 'block' : 'none';
  $('map').style.display = on ? 'none' : 'block';
  $('fab').dataset.v = on ? '1' : '0';
  $('fab').textContent = on ? 'กลับไปแผนที่' : 'สร้างโมเดล';
  if (on) resize(); else map.invalidateSize();
}
$('back').onclick = () => viewMode(false);

function fatLines(P, mat) {                        // P = [ax,ay,az,bx,by,bz, ...] → แถบเส้นหนา
  const n = P.length/6, pos = new Float32Array(n*12), pb = new Float32Array(n*12);
  const co = new Float32Array(n*8), ix = new Uint32Array(n*6);
  for (let s = 0; s < n; s++) {
    for (let v = 0; v < 4; v++) {
      const o = (s*4+v)*3;
      for (let k = 0; k < 3; k++) { pos[o+k] = P[s*6+k]; pb[o+k] = P[s*6+3+k]; }
      co[(s*4+v)*2] = v >> 1; co[(s*4+v)*2+1] = (v & 1) ? 1 : -1;
    }
    ix.set([s*4, s*4+1, s*4+2, s*4+2, s*4+1, s*4+3], s*6);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('pb', new THREE.BufferAttribute(pb, 3));
  g.setAttribute('corner', new THREE.BufferAttribute(co, 2));
  g.setIndex(new THREE.BufferAttribute(ix, 1));
  const m = new THREE.Mesh(g, mat || lineMat);
  m.frustumCulled = false;
  return m;
}
function applyLines() {
  if (!ren) return;
  lineMat.uniforms.width.value = +$('lw').value * ren.getPixelRatio();
  ren.getDrawingBufferSize(lineMat.uniforms.res.value);
  roadMat.uniforms.k.value = +$('rk').value;
  if (edgeGrp) edgeGrp.visible = $('mg').checked;
  draw();
}
$('mg').onchange = $('lw').oninput = $('rk').oninput = applyLines;

function meshOf(T, color) {                   // สามเหลี่ยม Z-up → mesh ของ Three (Y-up)
  const pos = new Float32Array(T.length);
  for (let i = 0; i < T.length; i += 3) { pos[i] = T[i]; pos[i+1] = T[i+2]; pos[i+2] = -T[i+1]; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({color, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1}));
}

function show() {
  if (!ren) initThree();
  grp.clear();
  const T = M.tris, pos = new Float32Array(T.length);
  for (let i = 0; i < T.length; i += 3) { pos[i] = T[i]; pos[i+1] = T[i+2]; pos[i+2] = -T[i+1]; } // Z-up → Y-up
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  grp.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({color: dark ? 0x9aa3ad : 0xcdc8bd, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1})));
  edgeGrp = new THREE.Group(); grp.add(edgeGrp);
  if (M.tris.length && M.nb <= 15000) edgeGrp.add(fatLines(new THREE.EdgesGeometry(g, 25).attributes.position.array));
  RCLS.forEach((r, k) => { if (M.rcls[k].length) grp.add(meshOf(M.rcls[k], r.c)); });
  if (M.redges.length) {
    const P = [];
    for (let i = 0; i < M.redges.length; i += 3) P.push(M.redges[i], M.redges[i+2], -M.redges[i+1]);
    edgeGrp.add(fatLines(P, roadMat));
  }
  const cols = [dark ? 0x4a5560 : 0xb9b3a4, 0x3f86c9, 0x6fa86a];   // ดิน, น้ำ, สีเขียว
  for (let c = 0; c < 3; c++) {
    const T = [];
    for (const f of M.terr) if (f.c === c) T.push(...f.t);
    if (T.length) grp.add(meshOf(T, cols[c]));
  }
  const Cs = [];
  for (const c of M.contours || []) for (let i = 0; i < c.pts.length-1; i++)
    Cs.push(c.pts[i][0], c.z+.4, -c.pts[i][1], c.pts[i+1][0], c.z+.4, -c.pts[i+1][1]);
  if (Cs.length) {
    const cg = new THREE.BufferGeometry();
    cg.setAttribute('position', new THREE.Float32BufferAttribute(Cs, 3));
    grp.add(new THREE.LineSegments(cg, new THREE.LineBasicMaterial({color: dark ? 0xd9a066 : 0x9a6b3d})));
  }
  const k = +$('size').value*1000;
  grp.add(new THREE.GridHelper(k, 10, 0x888888, dark ? 0x333a42 : 0xdddddd));
  rot.d = k*.9;
  viewMode(true);
}

/* ---------- 5. ส่งออกไฟล์ ---------- */
function dl(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function exportDXF() {                        // DXF R12 อ่านได้ทุกเวอร์ชันของ AutoCAD
  const f = v => (+v).toFixed(3), T = M.tris, out = [];
  out.push('0\nSECTION\n2\nTABLES\n0\nTABLE\n2\nLTYPE\n70\n1\n0\nLTYPE\n2\nCONTINUOUS\n70\n0\n3\nSolid line\n72\n65\n73\n0\n40\n0.0\n0\nENDTAB');
  out.push('0\nTABLE\n2\nLAYER\n70\n12');
  for (const [l, cc] of [['BUILDINGS',7],['ROADS_EXPRESSWAY',30],['ROADS_MAIN',50],['ROADS_SECONDARY',2],['ROADS_LOCAL',7],['ROADS_PATH',8],['RIVERS',140],['ROAD_CENTER',9],['CONTOURS',32],['TERRAIN',253],['WATER',5],['GREEN',3]])
    out.push(`0\nLAYER\n2\n${l}\n70\n0\n62\n${cc}\n6\nCONTINUOUS`);
  out.push('0\nENDTAB\n0\nENDSEC\n0\nSECTION\n2\nENTITIES');
  const idx = [0,3,6,6];
  for (let i = 0; i < T.length; i += 9) {
    let s = '0\n3DFACE\n8\nBUILDINGS';
    idx.forEach((k,j) => { s += `\n${10+j}\n${f(T[i+k])}\n${20+j}\n${f(T[i+k+1])}\n${30+j}\n${f(T[i+k+2])}`; });
    out.push(s);
  }
  const faces = (A, layer) => {
    for (let i = 0; i < A.length; i += 9) {
      let s = '0\n3DFACE\n8\n' + layer;
      idx.forEach((k, j) => { s += `\n${10+j}\n${f(A[i+k])}\n${20+j}\n${f(A[i+k+1])}\n${30+j}\n${f(A[i+k+2])}`; });
      out.push(s);
    }
  };
  RCLS.forEach((r, k) => faces(M.rcls[k], r.layer));
  ['TERRAIN', 'WATER', 'GREEN'].forEach((L, c) => {
    const A = [];
    for (const q of M.terr) if (q.c === c) A.push(...q.t);
    faces(A, L);
  });
  for (const r of M.roads) {                  // เส้นกลางถนน (3D polyline ตามพื้นดิน)
    if (r.length < 2) continue;
    out.push('0\nPOLYLINE\n8\nROAD_CENTER\n66\n1\n70\n8');
    for (const p of r) out.push(`0\nVERTEX\n8\nROAD_CENTER\n10\n${f(p[0])}\n20\n${f(p[1])}\n30\n${f(p[2])}\n70\n32`);
    out.push('0\nSEQEND\n8\nROAD_CENTER');
  }
  for (const c of M.contours || []) {
    out.push('0\nPOLYLINE\n8\nCONTOURS\n66\n1\n70\n8');
    for (const p of c.pts) out.push(`0\nVERTEX\n8\nCONTOURS\n10\n${f(p[0])}\n20\n${f(p[1])}\n30\n${f(c.z)}\n70\n32`);
    out.push('0\nSEQEND\n8\nCONTOURS');
  }
  out.push('0\nENDSEC\n0\nEOF\n');
  dl('city.dxf', out.join('\n'), 'application/dxf');
}

function exportSTL() {                        // อาคารอย่างเดียว สำหรับพิมพ์ 3 มิติ
  const T = M.tris, out = ['solid city'];
  for (let i = 0; i < T.length; i += 9) {
    const ux=T[i+3]-T[i], uy=T[i+4]-T[i+1], uz=T[i+5]-T[i+2];
    const vx=T[i+6]-T[i], vy=T[i+7]-T[i+1], vz=T[i+8]-T[i+2];
    const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx, l=Math.hypot(nx,ny,nz)||1;
    out.push(`facet normal ${nx/l} ${ny/l} ${nz/l}`, 'outer loop');
    for (let k = 0; k < 9; k += 3) out.push(`vertex ${T[i+k]} ${T[i+k+1]} ${T[i+k+2]}`);
    out.push('endloop', 'endfacet');
  }
  out.push('endsolid city');
  dl('city.stl', out.join('\n'), 'model/stl');
}
/* ---------- 5.1 DAE (Collada) และ OBJ สำหรับ SketchUp / Rhino / Blender ---------- */
function parts() {                            // แยกกลุ่มวัตถุตามวัสดุ
  const P = [{n:'BUILDINGS', T:M.tris, c:[.80,.78,.73]}];
  RCLS.forEach((r, k) => P.push({n: r.layer, T: M.rcls[k], c: [r.c >> 16 & 255, r.c >> 8 & 255, r.c & 255].map(x => x/255)}));
  [['TERRAIN',[.72,.70,.64]], ['WATER',[.25,.53,.79]], ['GREEN',[.44,.66,.42]]].forEach(([n, c], i) => {
    const T = [];
    for (const q of M.terr) if (q.c === i) T.push(...q.t);
    P.push({n, T, c});
  });
  return P.filter(p => p.T.length);
}
function indexed(T) {                         // รวมจุดซ้ำให้ไฟล์เล็กลง
  const m = new Map(), v = [], f = [];
  for (let i = 0; i < T.length; i += 3) {
    const x = T[i].toFixed(3), y = T[i+1].toFixed(3), z = T[i+2].toFixed(3), k = x+','+y+','+z;
    let j = m.get(k);
    if (j === undefined) { j = v.length/3; m.set(k, j); v.push(+x, +y, +z); }
    f.push(j);
  }
  return {v, f};
}
function exportOBJ() {
  const out = ['# urban model  units: meters  Z-up']; let off = 0;
  for (const p of parts()) {
    const {v, f} = indexed(p.T);
    out.push('g ' + p.n);
    for (let i = 0; i < v.length; i += 3) out.push(`v ${v[i]} ${v[i+1]} ${v[i+2]}`);
    for (let i = 0; i < f.length; i += 3) out.push(`f ${f[i]+1+off} ${f[i+1]+1+off} ${f[i+2]+1+off}`);
    off += v.length/3;
  }
  dl('city.obj', out.join('\n'), 'text/plain');
}
function exportDAE() {
  const P = parts(), col = c => c.map(x => x.toFixed(3)).join(' ');
  let fx = '', mt = '', ge = '', nd = '';
  P.forEach((p, i) => {
    const {v, f} = indexed(p.T);
    fx += `<effect id="m${i}-fx"><profile_COMMON><technique sid="common"><lambert><diffuse><color>${col(p.c)} 1</color></diffuse></lambert></technique></profile_COMMON></effect>`;
    mt += `<material id="m${i}" name="${p.n}"><instance_effect url="#m${i}-fx"/></material>`;
    ge += `<geometry id="g${i}" name="${p.n}"><mesh><source id="g${i}-p"><float_array id="g${i}-a" count="${v.length}">${v.join(' ')}</float_array><technique_common><accessor source="#g${i}-a" count="${v.length/3}" stride="3"><param name="X" type="float"/><param name="Y" type="float"/><param name="Z" type="float"/></accessor></technique_common></source><vertices id="g${i}-v"><input semantic="POSITION" source="#g${i}-p"/></vertices><triangles material="m${i}" count="${f.length/3}"><input semantic="VERTEX" source="#g${i}-v" offset="0"/><p>${f.join(' ')}</p></triangles></mesh></geometry>`;
    nd += `<node id="n${i}" name="${p.n}"><instance_geometry url="#g${i}"><bind_material><technique_common><instance_material symbol="m${i}" target="#m${i}"/></technique_common></bind_material></instance_geometry></node>`;
  });
  const xml = `<?xml version="1.0" encoding="utf-8"?>\n<COLLADA xmlns="http://www.collada.org/2005/11/COLLADASchema" version="1.4.1"><asset><unit name="meter" meter="1"/><up_axis>Z_UP</up_axis></asset><library_effects>${fx}</library_effects><library_materials>${mt}</library_materials><library_geometries>${ge}</library_geometries><library_visual_scenes><visual_scene id="Scene" name="Scene">${nd}</visual_scene></library_visual_scenes><scene><instance_visual_scene url="#Scene"/></scene></COLLADA>`;
  dl('city.dae', xml, 'model/vnd.collada+xml');
}
/* ---------- 5.2 SVG (ผังมุมมองจากด้านบน) และ IFC4 ---------- */
function exportSVG() {                        // 1 หน่วย = 1 เมตร แยกเลเยอร์เป็นกลุ่ม <g id=...>
  const half = +$('size').value*500, R = M.raw, f = v => v.toFixed(2);
  const pts = p => p.map(v => f(v[0]) + ',' + f(-v[1])).join(' ');
  const ringD = p => 'M' + p.map(v => f(v[0]) + ',' + f(-v[1])).join('L') + 'Z';
  let s = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${half*2}" height="${half*2}" viewBox="${-half} ${-half} ${half*2} ${half*2}">\n`;
  s += `<defs><clipPath id="clip"><rect x="${-half}" y="${-half}" width="${half*2}" height="${half*2}"/></clipPath></defs>\n`;
  s += '<g clip-path="url(#clip)" fill="none" stroke-linejoin="round" stroke-linecap="round">\n';
  s += '<g id="GREEN" fill="#d6ead0" stroke="#111" stroke-width="0.5">' + R.G.map(o => `<path d="${ringD(o.p)}"/>`).join('') + '</g>\n';
  s += '<g id="WATER" fill="#bfe0f5" stroke="#111" stroke-width="0.5">' + R.W.map(o => `<path fill-rule="evenodd" d="${[o.p, ...o.h].map(ringD).join('')}"/>`).join('') + '</g>\n';
  s += '<g id="CONTOURS" stroke="#9a6b3d" stroke-width="0.3">' + (M.contours || []).map(c => `<polyline points="${pts(c.pts)}"/>`).join('') + '</g>\n';
  for (const k of [5, 4, 3, 2, 1, 0]) {        // วาดถนนเล็กก่อน ถนนใหญ่ทับ
    const rs = R.R.filter(o => o.k === k);
    if (!rs.length) continue;
    const L = RCLS[k].layer;
    if (k !== 5) s += `<g id="${L}_CASING" stroke="#111">` + rs.map(o => `<polyline points="${pts(o.p)}" stroke-width="${o.w+1.2}"/>`).join('') + '</g>\n';
    s += `<g id="${L}" stroke="${RCLS[k].css}">` + rs.map(o => `<polyline points="${pts(o.p)}" stroke-width="${o.w}"/>`).join('') + '</g>\n';
  }
  s += '<g id="BUILDINGS" fill="#e6e1d6" stroke="#111" stroke-width="0.8">' + R.B.map(o => `<polygon points="${pts(o.p)}"/>`).join('') + '</g>\n';
  s += '</g>\n</svg>\n';
  dl('city.svg', s, 'image/svg+xml');
}

function exportIFC() {                        // IFC4 ใช้ IfcTriangulatedFaceSet: ตึกแยกหลัง ถนน และภูมิประเทศ
  const L = []; let id = 0;
  const add = s => { L.push(`#${++id}=${s};`); return '#' + id; };
  const cs = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_$';
  const guid = () => {                        // GlobalId 22 ตัวอักษรตามมาตรฐาน IFC
    let n = 0n;
    for (const x of crypto.getRandomValues(new Uint8Array(16))) n = (n << 8n) | BigInt(x);
    let g = '';
    for (let i = 0; i < 22; i++) { g = cs[Number(n & 63n)] + g; n >>= 6n; }
    return g;
  };
  const r = v => (+v).toFixed(3);
  const dms = v => {
    const sg = v < 0 ? -1 : 1; v = Math.abs(v);
    const d = Math.floor(v), m = Math.floor((v-d)*60), sc = Math.floor(((v-d)*60-m)*60);
    const u = Math.round((((v-d)*60-m)*60-sc)*1e6);
    return `(${sg*d},${sg*m},${sg*sc},${sg*u})`;
  };
  const o0 = add('IFCCARTESIANPOINT((0.,0.,0.))');
  const dz = add('IFCDIRECTION((0.,0.,1.))'), dx = add('IFCDIRECTION((1.,0.,0.))');
  const ax = add(`IFCAXIS2PLACEMENT3D(${o0},${dz},${dx})`);
  const ctx = add(`IFCGEOMETRICREPRESENTATIONCONTEXT($,'Model',3,1.E-05,${ax},$)`);
  const sub = add(`IFCGEOMETRICREPRESENTATIONSUBCONTEXT('Body','Model',*,*,*,*,${ctx},$,.MODEL_VIEW.,$)`);
  const un = add('IFCSIUNIT(*,.LENGTHUNIT.,$,.METRE.)');
  const ua = add(`IFCUNITASSIGNMENT((${un}))`);
  const prj = add(`IFCPROJECT('${guid()}',$,'Urban Model',$,$,$,$,(${ctx}),${ua})`);
  const pl0 = add(`IFCLOCALPLACEMENT($,${ax})`);
  const site = add(`IFCSITE('${guid()}',$,'Site',$,$,${pl0},$,$,.ELEMENT.,${dms(M.lat || 0)},${dms(M.lng || 0)},0.,$,$)`);
  const pl = add(`IFCLOCALPLACEMENT(${pl0},${ax})`);
  const body = T => {
    const {v, f} = indexed(T), P = [], I = [];
    for (let i = 0; i < v.length; i += 3) P.push(`(${r(v[i])},${r(v[i+1])},${r(v[i+2])})`);
    for (let i = 0; i < f.length; i += 3) I.push(`(${f[i]+1},${f[i+1]+1},${f[i+2]+1})`);
    const pt = add(`IFCCARTESIANPOINTLIST3D((${P.join(',')}))`);
    const fs = add(`IFCTRIANGULATEDFACESET(${pt},$,$,(${I.join(',')}),$)`);
    const rp = add(`IFCSHAPEREPRESENTATION(${sub},'Body','Tessellation',(${fs}))`);
    return add(`IFCPRODUCTDEFINITIONSHAPE($,$,(${rp}))`);
  };
  const blds = [], others = [];
  M.bidx.forEach(([a, b], i) => {
    const sh = body(M.tris.slice(a, b));
    blds.push(add(`IFCBUILDING('${guid()}',$,'Building ${i+1}',$,$,${pl},${sh},$,.ELEMENT.,$,$,$)`));
  });
  RCLS.forEach((r, k) => {
    if (!M.rcls[k].length) return;
    const sh = body(M.rcls[k]);
    others.push(add(`IFCBUILDINGELEMENTPROXY('${guid()}',$,'${r.layer}',$,$,${pl},${sh},$,.NOTDEFINED.)`));
  });
  ['Terrain', 'Water', 'Green'].forEach((n, c) => {
    const T = [];
    for (const q of M.terr) if (q.c === c) T.push(...q.t);
    if (!T.length) return;
    const sh = body(T);
    others.push(add(`IFCGEOGRAPHICELEMENT('${guid()}',$,'${n}',$,$,${pl},${sh},$,.TERRAIN.)`));
  });
  add(`IFCRELAGGREGATES('${guid()}',$,$,$,${prj},(${site}))`);
  if (blds.length) add(`IFCRELAGGREGATES('${guid()}',$,$,$,${site},(${blds.join(',')}))`);
  if (others.length) add(`IFCRELCONTAINEDINSPATIALSTRUCTURE('${guid()}',$,$,$,(${others.join(',')}),${site})`);
  const t = new Date().toISOString().slice(0, 19);
  const txt = `ISO-10303-21;\nHEADER;\nFILE_DESCRIPTION(('ViewDefinition [ReferenceView_V1.2]'),'2;1');\nFILE_NAME('city.ifc','${t}',(''),(''),'Urban Model','Urban Model','');\nFILE_SCHEMA(('IFC4'));\nENDSEC;\nDATA;\n${L.join('\n')}\nENDSEC;\nEND-ISO-10303-21;\n`;
  dl('city.ifc', txt, 'application/x-step');
}
$('svg').onclick = exportSVG;
$('ifc').onclick = exportIFC;
$('dae').onclick = exportDAE;
$('obj').onclick = exportOBJ;
$('dxf').onclick = exportDXF;
$('stl').onclick = exportSTL;

/* ---------- 5.9 เมนูลิ้นชักซ้าย + ปุ่มลอย ---------- */
function closeMenu() { $('panel').classList.remove('open'); }
$('menu').onclick = () => $('panel').classList.toggle('open');
$('close').onclick = closeMenu;
$('stage').addEventListener('pointerdown', closeMenu);
$('fab').onclick = () => { if ($('fab').dataset.v === '1') viewMode(false); else build(); };
$('st').onclick = () => { $('st').textContent = ''; };

/* ---------- 6. PWA: ติดตั้งเป็นแอป + service worker ---------- */
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('inst').hidden = false; });
$('inst').onclick = async () => {
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice;
  installEvt = null; $('inst').hidden = true;
};
addEventListener('appinstalled', () => { $('inst').hidden = true; });
if ('serviceWorker' in navigator)
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
