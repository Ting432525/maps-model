<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>โมเดลเมือง 3D</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f7f6f2;--fg:#1d2733;--mut:#6b7684;--line:#d5d8dc;--acc:#1f5fa8}
@media(prefers-color-scheme:dark){:root{--bg:#14191f;--fg:#e6e9ed;--mut:#8c97a4;--line:#2b333c;--acc:#5aa2e8}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
#stage{flex:1;position:relative;min-height:0}
#map,#view{position:absolute;inset:0}
#view{display:none}
#view canvas{width:100%;height:100%;display:block;touch-action:none}
.panel{padding:10px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;padding:9px 14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=range]{flex:1;min-width:120px}
#st{color:var(--mut);font-size:14px;min-height:1.3em}
</style>
</head>
<body>
<header>โมเดลเมือง 3D จากข้อมูล OpenStreetMap</header>
<div id="stage"><div id="map"></div><div id="view"></div></div>
<div class="panel">
  <div class="row">
    <input id="q" type="search" placeholder="ค้นหาสถานที่ เช่น เชียงดาว" style="flex:1;min-width:140px;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)">
    <button id="sr">ค้นหา</button>
  </div>
  <div class="row">
    <label><input id="ct" type="checkbox" checked> เส้นชั้นความสูง</label>
    <label for="iv">ทุก</label>
    <select id="iv" style="font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)">
      <option value="0">อัตโนมัติ</option><option value="1">1 ม.</option><option value="2">2 ม.</option>
      <option value="5">5 ม.</option><option value="10">10 ม.</option><option value="20">20 ม.</option>
    </select>
  </div>
  <div class="row">
    <label for="size">ขนาดพื้นที่</label>
    <input id="size" type="range" min="0.2" max="2" step="0.1" value="0.6">
    <b id="sz"></b>
  </div>
  <div class="row">
    <button id="loc">ตำแหน่งของฉัน</button>
    <button id="go" class="p">สร้างโมเดล</button>
    <button id="back" disabled>กลับไปแผนที่</button>
  </div>
  <div class="row">
    <button id="dxf" disabled>ดาวน์โหลด DXF</button>
    <button id="stl" disabled>ดาวน์โหลด STL</button>
  </div>
  <div id="st">เลื่อนแผนที่ให้กรอบอยู่ตรงพื้นที่ที่ต้องการ แล้วกด "สร้างโมเดล"</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);

/* ---------- 1. แผนที่ + กรอบพื้นที่ ---------- */
const map = L.map('map').setView([13.7563, 100.5018], 16);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap contributors'
}).addTo(map);
const rect = L.rectangle([[0,0],[0,0]], {color:'#1f5fa8', weight:2, fillOpacity:.1}).addTo(map);

function bounds() {
  const c = map.getCenter(), k = +$('size').value;
  const dLat = k*1000/2/110540;
  const dLon = k*1000/2/(111320*Math.cos(c.lat*Math.PI/180));
  return {c, s:c.lat-dLat, n:c.lat+dLat, w:c.lng-dLon, e:c.lng+dLon};
}
function drawRect() {
  const b = bounds();
  rect.setBounds([[b.s,b.w],[b.n,b.e]]);
  $('sz').textContent = (+$('size').value).toFixed(1) + ' กม.';
}
map.on('move', drawRect);
$('size').oninput = drawRect;
drawRect();
$('loc').onclick = () => map.locate({setView:true, maxZoom:16});
map.on('locationerror', () => $('st').textContent = 'เข้าถึงตำแหน่งไม่ได้ ตรวจสอบสิทธิ์ตำแหน่งของเบราว์เซอร์');

/* ---------- 2. ดึงข้อมูลจาก Overpass ---------- */
let M = null; // {tris:[x,y,z,...], roads:[[[x,y],...]], nb}

async function build() {
  const b = bounds();
  $('go').disabled = true;
  $('st').textContent = 'กำลังดึงข้อมูลอาคารและถนน...';
  const bb = `${b.s},${b.w},${b.n},${b.e}`;
  const q = `[out:json][timeout:30];(way["building"](${bb});way["highway"](${bb}););out geom;`;
  try {
    const r = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'data=' + encodeURIComponent(q)
    });
    if (!r.ok) throw new Error('เซิร์ฟเวอร์ตอบ ' + r.status);
    const j = await r.json();
    M = convert(j.elements, b);
    if (!M.nb && !M.roads.length) throw new Error('ไม่พบข้อมูลในพื้นที่นี้');
    M.contours = [];
    let note = '';
    if ($('ct').checked) {
      $('st').textContent = 'กำลังดึงข้อมูลความสูง...';
      try {
        const t = await terrain(b, +$('size').value);
        M.contours = t.contours;
        note = t.contours.length
          ? ` · เส้นชั้นความสูง ${t.contours.length} เส้น (ต่ำสุด ${t.min.toFixed(0)} ม. สูงสุด ${t.max.toFixed(0)} ม. จากระดับน้ำทะเล)`
          : ' · พื้นที่ราบ ไม่มีเส้นชั้นความสูง';
      } catch (err) { note = ' · ดึงข้อมูลความสูงไม่ได้ (' + err.message + ')'; }
    }
    show();
    $('st').textContent = `อาคาร ${M.nb} หลัง · ถนน ${M.roads.length} เส้น` + note + ' · หน่วยเป็นเมตร จุดกำเนิดอยู่กลางพื้นที่';
    $('dxf').disabled = $('stl').disabled = $('back').disabled = false;
  } catch (e) {
    $('st').textContent = 'ผิดพลาด: ' + e.message + ' (ลองลดขนาดพื้นที่แล้วกดใหม่)';
  }
  $('go').disabled = false;
}
$('go').onclick = build;

/* ---------- 2.1 ค้นหาสถานที่ (Nominatim) ---------- */
async function search() {
  const q = $('q').value.trim(); if (!q) return;
  viewMode(false);
  $('st').textContent = 'กำลังค้นหา...';
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    const j = await r.json();
    if (!j.length) throw new Error('ไม่พบสถานที่ "' + q + '"');
    map.setView([+j[0].lat, +j[0].lon], 16);
    $('st').textContent = j[0].display_name;
  } catch (e) { $('st').textContent = 'ค้นหาไม่ได้: ' + e.message; }
}
$('sr').onclick = search;
$('q').onkeydown = e => { if (e.key === 'Enter') search(); };

/* ---------- 2.2 ภูมิประเทศ + เส้นชั้นความสูง ---------- */
function loadTile(z, x, y) {                  // AWS Terrain Tiles (terrarium): สูง = R*256 + G + B/256 - 32768
  return new Promise((res, rej) => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d', {willReadFrequently: true});
      g.drawImage(im, 0, 0);
      const d = g.getImageData(0, 0, 256, 256).data, e = new Float32Array(65536);
      for (let i = 0; i < 65536; i++) e[i] = d[i*4]*256 + d[i*4+1] + d[i*4+2]/256 - 32768;
      res(e);
    };
    im.onerror = () => rej(new Error('โหลดภาพความสูงไม่ได้'));
    im.src = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`;
  });
}

async function terrain(b, size) {
  const z = 14, N = Math.pow(2, z)*256;
  const px = lon => (lon+180)/360*N;
  const py = lat => { const r = lat*Math.PI/180; return (1 - Math.log(Math.tan(r) + 1/Math.cos(r))/Math.PI)/2*N; };
  const x0 = px(b.w)-2, x1 = px(b.e)+2, y0 = py(b.n)-2, y1 = py(b.s)+2;
  const tiles = new Map(), jobs = [];
  for (let ty = Math.floor(y0/256); ty <= Math.floor(y1/256); ty++)
    for (let tx = Math.floor(x0/256); tx <= Math.floor(x1/256); tx++)
      jobs.push(loadTile(z, tx, ty).then(e => tiles.set(tx+','+ty, e)));
  await Promise.all(jobs);
  const get = (ix, iy) => {
    const t = tiles.get(Math.floor(ix/256)+','+Math.floor(iy/256));
    return t ? t[(((iy%256)+256)%256)*256 + (((ix%256)+256)%256)] : NaN;
  };
  const el = (lon, lat) => {                  // ค่าเฉลี่ยแบบ bilinear
    const fx = px(lon)-.5, fy = py(lat)-.5, ix = Math.floor(fx), iy = Math.floor(fy), u = fx-ix, v = fy-iy;
    return (get(ix,iy)*(1-u) + get(ix+1,iy)*u)*(1-v) + (get(ix,iy+1)*(1-u) + get(ix+1,iy+1)*u)*v;
  };
  const n1 = Math.min(120, Math.max(20, Math.round(size*100)));   // ช่องละประมาณ 10 ม.
  const half = size*500, d = size*1000/n1, W = n1+1, Z = new Float32Array(W*W);
  let mn = 1e9, mx = -1e9;
  for (let j = 0; j <= n1; j++) for (let i = 0; i <= n1; i++) {
    const v = el(b.w + (b.e-b.w)*i/n1, b.s + (b.n-b.s)*j/n1);
    if (!isFinite(v)) throw new Error('ข้อมูลความสูงไม่ครบ');
    Z[j*W+i] = v; if (v < mn) mn = v; if (v > mx) mx = v;
  }
  const rg = mx-mn;
  const iv = $('iv').value === '0' ? ([1,2,5,10,20,50,100].find(v => rg/v <= 15) || 200) : +$('iv').value;
  const contours = [];
  if (rg >= iv)
    for (let L = Math.ceil(mn/iv)*iv; L <= mx; L += iv)
      for (const pts of marching(Z, n1, n1, -half, -half, d, d, L)) contours.push({z: L-mn, pts});
  return {contours, min: mn, max: mx};
}

function marching(Z, nx, ny, x0, y0, dx, dy, L) {   // marching squares แล้วต่อเส้นเป็นสายยาว
  const W = nx+1, pts = new Map(), segs = [], adj = new Map();
  const T = [[],[[3,0]],[[0,1]],[[3,1]],[[1,2]],[[0,1],[2,3]],[[0,2]],[[3,2]],[[2,3]],[[0,2]],[[3,0],[1,2]],[[1,2]],[[3,1]],[[0,1]],[[3,0]],[]];
  const edge = (e, i, j) => {
    let k, a, b;
    if (e === 0)      { k = 'h'+i+','+j;       a = [i,j];     b = [i+1,j]; }
    else if (e === 2) { k = 'h'+i+','+(j+1);   a = [i,j+1];   b = [i+1,j+1]; }
    else if (e === 1) { k = 'v'+(i+1)+','+j;   a = [i+1,j];   b = [i+1,j+1]; }
    else              { k = 'v'+i+','+j;       a = [i,j];     b = [i,j+1]; }
    if (!pts.has(k)) {
      const za = Z[a[1]*W+a[0]], zb = Z[b[1]*W+b[0]], t = (L-za)/(zb-za);
      pts.set(k, [x0 + (a[0] + (b[0]-a[0])*t)*dx, y0 + (a[1] + (b[1]-a[1])*t)*dy]);
    }
    return k;
  };
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const c = (Z[j*W+i] >= L ? 1 : 0) | (Z[j*W+i+1] >= L ? 2 : 0) | (Z[(j+1)*W+i+1] >= L ? 4 : 0) | (Z[(j+1)*W+i] >= L ? 8 : 0);
    for (const [e1, e2] of T[c]) {
      const k1 = edge(e1,i,j), k2 = edge(e2,i,j), s = segs.length;
      segs.push([k1,k2]);
      for (const k of [k1,k2]) { if (!adj.has(k)) adj.set(k, []); adj.get(k).push(s); }
    }
  }
  const used = new Uint8Array(segs.length), lines = [];
  const next = k => { for (const s of adj.get(k)) if (!used[s]) return s; return -1; };
  for (let s0 = 0; s0 < segs.length; s0++) {
    if (used[s0]) continue;
    used[s0] = 1;
    const ks = [segs[s0][0], segs[s0][1]];
    for (let side = 0; side < 2; side++) for (;;) {
      const end = side ? ks[0] : ks[ks.length-1], s = next(end);
      if (s < 0) break;
      used[s] = 1;
      const o = segs[s][0] === end ? segs[s][1] : segs[s][0];
      if (side) ks.unshift(o); else ks.push(o);
    }
    lines.push(ks.map(k => pts.get(k)));
  }
  return lines;
}

/* ---------- 3. แปลงพิกัด + ดันอาคารขึ้นเป็น 3 มิติ ---------- */
function convert(els, b) {
  const kx = 111320*Math.cos(b.c.lat*Math.PI/180), ky = 110540;
  const P = g => g.map(p => [(p.lon-b.c.lng)*kx, (p.lat-b.c.lat)*ky]);
  const tris = [], roads = []; let nb = 0;
  for (const el of els) {
    if (!el.geometry) continue;
    const t = el.tags || {};
    if (t.building) {
      const pts = P(el.geometry);
      const f = pts[0], l = pts[pts.length-1];
      if (pts.length > 1 && f[0] === l[0] && f[1] === l[1]) pts.pop();
      if (pts.length < 3) continue;
      let h = parseFloat(t.height);
      if (!(h > 0)) { const lv = parseFloat(t['building:levels']); h = lv > 0 ? lv*3 : 8; }
      addBuilding(pts, h, tris); nb++;
    } else if (t.highway) roads.push(P(el.geometry));
  }
  return {tris, roads, nb};
}

function addBuilding(p, h, T) {
  let a = 0;
  for (let i = 0; i < p.length; i++) { const q = p[(i+1)%p.length]; a += p[i][0]*q[1] - q[0]*p[i][1]; }
  if (a < 0) p = p.slice().reverse();          // ให้วนทวนเข็มเสมอ
  const n = p.length;
  for (let i = 0; i < n; i++) {                // ผนัง
    const A = p[i], B = p[(i+1)%n];
    T.push(A[0],A[1],0, B[0],B[1],0, B[0],B[1],h,  A[0],A[1],0, B[0],B[1],h, A[0],A[1],h);
  }
  let tr = [];                                 // หลังคา
  try { tr = THREE.ShapeUtils.triangulateShape(p.map(x => new THREE.Vector2(x[0],x[1])), []); } catch (e) {}
  for (const t of tr) {
    let [i,j,k] = t;
    const cz = (p[j][0]-p[i][0])*(p[k][1]-p[i][1]) - (p[j][1]-p[i][1])*(p[k][0]-p[i][0]);
    if (cz < 0) [j,k] = [k,j];                 // หันหน้าขึ้นฟ้า
    T.push(p[i][0],p[i][1],h, p[j][0],p[j][1],h, p[k][0],p[k][1],h);
  }
}

/* ---------- 4. แสดงตัวอย่าง 3 มิติ (Three.js) ---------- */
let ren, scene, cam, grp;
const rot = {a:.8, e:.7, d:600};
const dark = matchMedia('(prefers-color-scheme: dark)').matches;

function initThree() {
  ren = new THREE.WebGLRenderer({antialias:true});
  ren.setPixelRatio(devicePixelRatio);
  $('view').appendChild(ren.domElement);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(dark ? 0x14191f : 0xf7f6f2);
  cam = new THREE.PerspectiveCamera(50, 1, 1, 100000);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, .85));
  const d = new THREE.DirectionalLight(0xffffff, .6); d.position.set(1,2,.5); scene.add(d);
  grp = new THREE.Group(); scene.add(grp);

  const el = ren.domElement, ptr = new Map();
  el.onpointerdown = e => { el.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]); };
  el.onpointerup = el.onpointercancel = e => ptr.delete(e.pointerId);
  el.onpointermove = e => {
    const o = ptr.get(e.pointerId); if (!o) return;
    if (ptr.size === 1) {
      rot.a -= (e.clientX-o[0])*.008;
      rot.e = Math.max(.05, Math.min(1.55, rot.e + (e.clientY-o[1])*.008));
    } else if (ptr.size === 2) {
      const other = [...ptr].find(([id]) => id !== e.pointerId)[1];
      const d0 = Math.hypot(o[0]-other[0], o[1]-other[1]);
      const d1 = Math.hypot(e.clientX-other[0], e.clientY-other[1]);
      if (d1 > 0) rot.d *= d0/d1;
    }
    ptr.set(e.pointerId, [e.clientX, e.clientY]); draw();
  };
  el.onwheel = e => { e.preventDefault(); rot.d *= e.deltaY > 0 ? 1.1 : .9; draw(); };
  addEventListener('resize', resize);
}
function resize() {
  if (!ren) return;
  const v = $('view'), w = v.clientWidth, h = v.clientHeight;
  if (!w || !h) return;
  ren.setSize(w, h); cam.aspect = w/h; cam.updateProjectionMatrix(); draw();
}
function draw() {
  const {a,e,d} = rot;
  cam.position.set(d*Math.cos(e)*Math.sin(a), d*Math.sin(e), d*Math.cos(e)*Math.cos(a));
  cam.lookAt(0,0,0); ren.render(scene, cam);
}
function viewMode(on) {
  $('view').style.display = on ? 'block' : 'none';
  $('map').style.display = on ? 'none' : 'block';
  if (on) resize(); else map.invalidateSize();
}
$('back').onclick = () => viewMode(false);

function show() {
  if (!ren) initThree();
  grp.clear();
  const T = M.tris, pos = new Float32Array(T.length);
  for (let i = 0; i < T.length; i += 3) { pos[i] = T[i]; pos[i+1] = T[i+2]; pos[i+2] = -T[i+1]; } // Z-up → Y-up
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  grp.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({color: dark ? 0x9aa3ad : 0xcdc8bd, side: THREE.DoubleSide})));
  const Ls = [];
  for (const r of M.roads) for (let i = 0; i < r.length-1; i++)
    Ls.push(r[i][0],.3,-r[i][1], r[i+1][0],.3,-r[i+1][1]);
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(Ls, 3));
  grp.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({color: dark ? 0x5aa2e8 : 0x1f5fa8})));
  const Cs = [];
  for (const c of M.contours || []) for (let i = 0; i < c.pts.length-1; i++)
    Cs.push(c.pts[i][0], c.z, -c.pts[i][1], c.pts[i+1][0], c.z, -c.pts[i+1][1]);
  if (Cs.length) {
    const cg = new THREE.BufferGeometry();
    cg.setAttribute('position', new THREE.Float32BufferAttribute(Cs, 3));
    grp.add(new THREE.LineSegments(cg, new THREE.LineBasicMaterial({color: dark ? 0xd9a066 : 0x9a6b3d})));
  }
  const k = +$('size').value*1000;
  grp.add(new THREE.GridHelper(k, 10, 0x888888, dark ? 0x333a42 : 0xdddddd));
  rot.d = k*.9;
  viewMode(true);
}

/* ---------- 5. ส่งออกไฟล์ ---------- */
function dl(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function exportDXF() {                        // DXF R12 อ่านได้ทุกเวอร์ชันของ AutoCAD
  const f = v => (+v).toFixed(3), T = M.tris, out = [];
  out.push('0\nSECTION\n2\nTABLES\n0\nTABLE\n2\nLTYPE\n70\n1\n0\nLTYPE\n2\nCONTINUOUS\n70\n0\n3\nSolid line\n72\n65\n73\n0\n40\n0.0\n0\nENDTAB');
  out.push('0\nTABLE\n2\nLAYER\n70\n3');
  for (const l of ['BUILDINGS','ROADS','CONTOURS']) out.push(`0\nLAYER\n2\n${l}\n70\n0\n62\n7\n6\nCONTINUOUS`);
  out.push('0\nENDTAB\n0\nENDSEC\n0\nSECTION\n2\nENTITIES');
  const idx = [0,3,6,6];
  for (let i = 0; i < T.length; i += 9) {
    let s = '0\n3DFACE\n8\nBUILDINGS';
    idx.forEach((k,j) => { s += `\n${10+j}\n${f(T[i+k])}\n${20+j}\n${f(T[i+k+1])}\n${30+j}\n${f(T[i+k+2])}`; });
    out.push(s);
  }
  for (const r of M.roads) {
    if (r.length < 2) continue;
    out.push('0\nPOLYLINE\n8\nROADS\n66\n1\n70\n8');
    for (const p of r) out.push(`0\nVERTEX\n8\nROADS\n10\n${f(p[0])}\n20\n${f(p[1])}\n30\n0\n70\n32`);
    out.push('0\nSEQEND\n8\nROADS');
  }
  for (const c of M.contours || []) {
    out.push('0\nPOLYLINE\n8\nCONTOURS\n66\n1\n70\n8');
    for (const p of c.pts) out.push(`0\nVERTEX\n8\nCONTOURS\n10\n${f(p[0])}\n20\n${f(p[1])}\n30\n${f(c.z)}\n70\n32`);
    out.push('0\nSEQEND\n8\nCONTOURS');
  }
  out.push('0\nENDSEC\n0\nEOF\n');
  dl('city.dxf', out.join('\n'), 'application/dxf');
}

function exportSTL() {                        // อาคารอย่างเดียว สำหรับพิมพ์ 3 มิติ
  const T = M.tris, out = ['solid city'];
  for (let i = 0; i < T.length; i += 9) {
    const ux=T[i+3]-T[i], uy=T[i+4]-T[i+1], uz=T[i+5]-T[i+2];
    const vx=T[i+6]-T[i], vy=T[i+7]-T[i+1], vz=T[i+8]-T[i+2];
    const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx, l=Math.hypot(nx,ny,nz)||1;
    out.push(`facet normal ${nx/l} ${ny/l} ${nz/l}`, 'outer loop');
    for (let k = 0; k < 9; k += 3) out.push(`vertex ${T[i+k]} ${T[i+k+1]} ${T[i+k+2]}`);
    out.push('endloop', 'endfacet');
  }
  out.push('endsolid city');
  dl('city.stl', out.join('\n'), 'model/stl');
}
$('dxf').onclick = exportDXF;
$('stl').onclick = exportSTL;
</script>
